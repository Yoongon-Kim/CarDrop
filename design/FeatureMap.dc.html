<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CarDrop 기능 맵</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13}
a{color:#4FD1C5}a:hover{color:#8BE6DC}
</style>
</helmet>
<div style="width: 1440px; height: 820px; box-sizing: border-box; padding: 40px 48px; background: #0B0E13; color: #E8EDF2; font-family: 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column; gap: 24px">
  <div style="display: flex; justify-content: space-between; align-items: flex-end">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-size: 13px; letter-spacing: 0.12em; color: #4FD1C5; font-weight: 700">FEATURE MAP</div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -0.02em">무엇을 만들고, 무엇을 뺄까</h1>
    </div>
    <div style="font-size: 15px; color: #93A1B0">onPTT는 말을 전하고, 우리는 결정을 전한다</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; flex: 1">
    <sc-for list="{{cols}}" as="c" hint-placeholder-count="4">
      <div style="{{c.boxStyle}}">
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="{{c.tagStyle}}">{{c.tag}}</div>
          <div style="font-size: 22px; font-weight: 800">{{c.title}}</div>
          <div style="font-size: 13px; color: #93A1B0; line-height: 1.5">{{c.desc}}</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px">
          <sc-for list="{{c.items}}" as="it" hint-placeholder-count="5">
            <div style="background: #141C26; border: 1px solid #222C38; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px">
              <div style="font-size: 15px; font-weight: 700">{{it.n}}</div>
              <div style="font-size: 12.5px; color: #93A1B0; line-height: 1.5">{{it.d}}</div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  renderVals() {
    var cols = [
      { tag: 'A · 핵심', color: '#4FD1C5', title: '반드시 구현', desc: '시연의 뼈대. 화면 없이 음성만으로 끝까지 돈다.', items: [
        { n: '크루 등록', d: '연락처처럼 일행 차량만 연결 · 초대코드/QR' },
        { n: '음성 제안 (AI 의도 파악)', d: '“배고파” “화장실 급해” 같은 자연어 → 의도 분류' },
        { n: 'AI 후보 추천', d: '3대의 위치·도착 시간·연료·연속 주행을 함께 보고 2~3곳 추천' },
        { n: '응답 · 집계', d: '“덕평” “두 번째” “아무 데나” 해석 · 무응답은 1순위' },
        { n: '실행 + 일행 위치', d: '모든 차 내비에 경유지 자동 추가 · 투표 화면에 일행 위치' },
        { n: '안전 설계', d: '결정 드랍만 음성 안내 · 소셜 드랍은 화면에만 · 주행 중 터치 제한' }
      ] },
      { tag: 'B · 차별화', color: '#F6A04D', title: '1~2개 구현', desc: '창의성 점수. 차량 데이터가 소통의 재료가 된다.', items: [
        { n: '차가 먼저 보내는 드랍', d: '연료 부족 · 2시간 연속 운전 → 차가 먼저 휴식 제안' },
        { n: '음성 메시지 드랍', d: '“뒤에 사고 났어 조심해” 녹음해서 드랍 · 실시간 무전 대체' },
        { n: '노래 드랍', d: '지금 듣는 곡을 일행 차에 보내고 같이 듣기 (SDK 확인 필요)' },
        { n: '차 대항 AI 퀴즈', d: '지나가는 지역으로 문제 출제 · 음성 진행이라 운전자도 참여' }
      ] },
      { tag: 'C · 확장', color: '#9AA8FF', title: '기획서에 비전으로', desc: '시간이 남거나, 다음 단계로 보여줄 것.', items: [
        { n: '실시간 무전', d: 'A·B 완성 후 여유가 있을 때만' },
        { n: '짧은 신호 프리셋', d: '“먼저 가” “천천히 와” 한마디 전송' },
        { n: '동승자 폰 참여', d: '주행 중 화면 가림을 폰으로 우회' },
        { n: '에코 드라이빙 대결', d: '다음 휴게소까지 연비 대결' },
        { n: '여행 기록 · AI 추억 요약', d: '카메라 하드웨어 전제' }
      ] },
      { tag: 'D · 제외', color: '#6F7D8C', title: '빼는 것', desc: '정체성을 흐리거나 시연이 어려운 것.', items: [
        { n: '주변 차량 헌팅', d: '개인정보·안전 리스크 · 시연에 다른 사용자가 필요' },
        { n: '무전 중심 구성', d: 'onPTT와 정면 비교 시 열세' },
        { n: '속도 구간별 세부 잠금표', d: '결정/소셜 드랍 구분으로 대체' },
        { n: '영상통화', d: '하드웨어 불확실' }
      ] }
    ];
    return { cols: cols.map(function (c) {
      return {
        tag: c.tag, title: c.title, desc: c.desc, items: c.items,
        boxStyle: 'background: #12161D; border: 1px solid #1F2630; border-top: 4px solid ' + c.color + '; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 16px',
        tagStyle: 'font-size: 12px; font-weight: 800; letter-spacing: 0.08em; color: ' + c.color
      };
    }) };
  }
}
</script>
</body>
</html>
